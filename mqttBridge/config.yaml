name: "microBees MQTT Bridge"
version: "0.1.4"
slug: "mqtt_bridge"
description: "Invia su MQTT verso microBees dispositivi, entità ed eventi di Home Assistant così come sono."
url: "https://github.com/microBeesTech/ha_addon/tree/main/mqttBridge"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
# Rete dell'host: smartgate_serial = MAC dell'host, come lo calcola bnbees_integration (uuid.getnode)
host_network: true
# Accesso all'API WebSocket di Home Assistant tramite il Supervisor (registri e stati, sola lettura)
homeassistant_api: true
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  topic: "sensor.in.31"
  smartgate_serial: ""
  heartbeat_interval: 300
  send_device_status: true
  log_level: "info"
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  topic: str
  smartgate_serial: match(^$|^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$)?
  heartbeat_interval: int(30,86400)
  send_device_status: bool
  log_level: list(off|error|warning|info|debug)
