name: "MQTT Bridge"
version: "0.3.0"
slug: "mqtt_bridge"
description: "Invia su MQTT dispositivi, entità ed eventi di Home Assistant così come sono ed esegue i comandi ricevuti."
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
# Rete dell'host: smartgate_serial = MAC dell'host, letto con uuid.getnode() sulle interfacce dell'host
host_network: true
# Accesso all'API WebSocket di Home Assistant tramite il Supervisor (registri, stati ed esecuzione dei comandi ricevuti)
homeassistant_api: true
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  topic: "ha/in"
  command_topic: ""
  smartgate_serial: ""
  heartbeat_interval: 300
  send_device_status: true
  log_level: "info"
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  topic: str
  command_topic: str?
  smartgate_serial: match(^$|^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$)?
  heartbeat_interval: int(30,86400)
  send_device_status: bool
  log_level: list(off|error|warning|info|debug)
