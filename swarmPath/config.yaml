name: "swarmPath"
version: "1.2.1"
slug: "swarmpath"
description: "Connette il dispositivo microBees a swarmPath e offre un'API locale opzionale per la prova Home Assistant."
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
host_network: true
init: false
homeassistant_api: true
map:
  - config:rw
  - ssl:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw
privileged:
  - NET_ADMIN
  - SYS_ADMIN
  - SYS_MODULE
  - NET_RAW
options:
  vpn_enabled: true
  api_enabled: false
  api_bind: "127.0.0.1"
  api_port: 8099
  api_allowed_clients:
    - "127.0.0.1"
schema:
  vpn_enabled: bool
  api_enabled: bool
  api_bind: str
  api_port: port
  api_allowed_clients:
    - str